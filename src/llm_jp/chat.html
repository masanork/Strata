<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>LLM-jp × Strata</title><style>
:root{color-scheme:light dark;font-family:system-ui,sans-serif}body{max-width:860px;margin:0 auto;padding:1rem;line-height:1.6}header{border-bottom:1px solid #8885;margin-bottom:1rem}h1{font-size:1.35rem;margin:.2rem 0}small,#status{color:#888}#messages{min-height:50vh;display:flex;flex-direction:column;gap:1rem}.message{padding:.8rem 1rem;border-radius:12px;background:#8882;white-space:pre-wrap;overflow-wrap:anywhere}.message.user{align-self:flex-end;background:#3884ff28;max-width:90%}.message.assistant{align-self:stretch}.label{font-size:.78rem;font-weight:bold;color:#888;margin-bottom:.25rem}form{position:sticky;bottom:0;padding:1rem 0;background:Canvas}textarea{box-sizing:border-box;width:100%;min-height:5rem;padding:.7rem;font:inherit;border:1px solid #888;border-radius:8px;resize:vertical}button{padding:.5rem 1rem;font:inherit;margin-right:.5rem;cursor:pointer}.controls{display:flex;align-items:center;gap:.5rem;flex-wrap:wrap;margin-top:.4rem}input{width:5rem;font:inherit}#status{font-size:.85rem}
</style></head><body><header><h1>LLM-jp × Strata</h1><small>Radeon VII ローカル実験版 · 一度に1件 · 会話履歴はこのページ内に保存</small></header>
<main id="messages" aria-live="polite"></main>
<form id="form"><textarea id="prompt" placeholder="メッセージを入力" required></textarea><div class="controls"><button id="send">送信</button><button id="stop" type="button" disabled>停止</button><button id="clear" type="button">会話を消去</button><label>生成上限 <input id="limit" type="number" min="1" max="1024" value="256"></label><span id="status">準備完了</span></div></form>
<script>
const history=[],form=document.querySelector('#form'),input=document.querySelector('#prompt'),messages=document.querySelector('#messages'),status=document.querySelector('#status'),send=document.querySelector('#send'),stop=document.querySelector('#stop'),clear=document.querySelector('#clear'),limit=document.querySelector('#limit');let controller=null;
function bubble(role,text=''){const box=document.createElement('div');box.className='message '+role;const label=document.createElement('div');label.className='label';label.textContent=role==='user'?'あなた':'LLM-jp';const body=document.createElement('div');body.textContent=text;box.append(label,body);messages.append(box);return body;}
form.addEventListener('submit',async e=>{e.preventDefault();const prompt=input.value.trim();if(!prompt||controller)return;const count=Number(limit.value);if(!Number.isInteger(count)||count<1||count>1024){status.textContent='生成上限は1〜1024にしてください';return}const prior=history.slice();bubble('user',prompt);const result=bubble('assistant');input.value='';send.disabled=true;stop.disabled=false;clear.disabled=true;controller=new AbortController();status.textContent='入力を処理中・思考中…';let answer='',finish=null,done=false;
try{const response=await fetch('/v1/chat/completions',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({model:'LLM-jp-4.1-32b-a3b-thinking-Q4_K_M-gfx906',messages:[...prior,{role:'user',content:prompt}],temperature:0,max_tokens:count,stream:true}),signal:controller.signal});if(!response.ok){const err=await response.json();throw new Error(err.error?.message||response.statusText)}const reader=response.body.getReader(),decoder=new TextDecoder();let buffer='';while(true){const {value,done:end}=await reader.read();buffer+=decoder.decode(value||new Uint8Array(),{stream:!end});const events=buffer.split('\n\n');buffer=events.pop();for(const event of events){if(event.startsWith(': processing')){if(!answer)status.textContent='思考中… '+event.slice(13).trim()+' トークン';continue}if(!event.startsWith('data: '))continue;const data=event.slice(6);if(data==='[DONE]'){done=true;continue}const item=JSON.parse(data);if(item.error)throw new Error(item.error.message);const choice=item.choices?.[0];if(choice?.delta?.content){answer+=choice.delta.content;result.textContent=answer;status.textContent='回答を生成中…';}if(choice?.finish_reason)finish=choice.finish_reason;}if(end)break;}
if(!done)throw new Error('応答が途中で切れました');if(!answer){result.textContent='最終回答に到達しませんでした。生成上限を増やしてください。';status.textContent='生成上限に到達';}else{history.push({role:'user',content:prompt},{role:'assistant',content:answer});status.textContent=finish==='length'?'生成上限で終了しました':'準備完了';}
}catch(err){result.textContent=answer+(answer?'\n\n':'')+(err.name==='AbortError'?'停止しました。':'エラー: '+err.message);status.textContent=err.name==='AbortError'?'停止':'エラー';}finally{controller=null;send.disabled=false;stop.disabled=true;clear.disabled=false;}});
stop.addEventListener('click',()=>controller?.abort());clear.addEventListener('click',()=>{if(controller)return;history.length=0;messages.replaceChildren();status.textContent='準備完了';});
</script></body></html>
